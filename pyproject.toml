[project]
name = "driveoff"
version = "0.2.0"
description = "Prototype for research drive offboarding and archiving, from IDS team."
authors = [
    { name = "Chris Seal", email = "c.seal@auckland.ac.nz" },
    { name = "Noel Zeng" },
    { name = "Libby Li" },
    { name = "Jean Love" },
    { name = "Andrew Wilson" },
    { name = "Rose McColl"},
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.137.1,<0.138.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "bagit>=1.8.1,<2.0.0",
    "rocrate>=0.14.2,<0.15.0",
    "orjson>=3.10,<4.0.0",
    "pydantic-settings>=2.6.1,<3.0.0",
    "boto3>=1.42.65,<2.0.0",
    "types-boto3-s3>=1.42.37,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "asgi-correlation-id>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<10.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "mypy>=1.11.2,<2.0.0",
    "coverage>=7.6.1,<8.0.0",
    "setuptools>=83.0.0,<84.0.0",
    "ruff>=0.11.0,<1.0.0",
    "types-python-dateutil>=2.9.0,<3.0.0",
    "types-PyYAML>=6.0.4,<7.0.0",
    "types-simplejson>=3.10.0,<4.0.0",
]
test = [
    "pytest>=8.3.3,<10.0.0",
    "rocrate>=0.14.2,<0.15.0",
    "orjson>=3.10,<4.0.0",
    "bagit>=1.8.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.mypy]
files = [
    "src/**/*.py",
]
ignore_missing_imports = true
exclude = [
    "^tests/.*$",
]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "models", "packaging", "service", "utils", "workers"]
